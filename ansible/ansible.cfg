# ansible.cfg — project-local config. Ansible auto-detects this when you
# run `ansible-playbook` from the ansible/ directory.

[defaults]
inventory         = ./inventory.ini
remote_user       = ubuntu
private_key_file  = ~/.ssh/bobross-gallery
host_key_checking = False
stdout_callback   = default
result_format     = yaml
# host_key_checking is off because the EC2 IP changes on every
# terraform destroy/apply. Fine for a learning project; in prod you would
# use known_hosts entries or AWS Systems Manager.

[ssh_connection]
pipelining = True
# Skips an extra SSH call per task, roughly 2x faster runs.
