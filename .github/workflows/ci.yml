name: CI

# Runs on:
#   - every push to main (then also builds + pushes the image to GHCR)
#   - every pull request against main (test only, no push)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + unit tests on the Node app. Fast, runs on every PR.
  # ---------------------------------------------------------------------------
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. Build the Docker image and push to GHCR.
  #    Only runs on push to main AND only if the test job above passed.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # permissions are required for GITHUB_TOKEN to push packages (GHCR).
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces two tags per build:
      #   - :latest         (always points to newest main)
      #   - :<short-sha>    (e.g. :a1b2c3d, so Phase 5 can pin to a specific commit)
      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bobross-gallery
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs via GitHub Actions' built-in cache.
          # First run is a cold build; later runs reuse unchanged layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
