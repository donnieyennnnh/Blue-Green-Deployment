name: Rollback

# Manually triggered from the Actions tab:
#   Actions → Rollback → Run workflow → Run.
# Flips Nginx on the EC2 back to the previously-live color.

on:
  workflow_dispatch:

jobs:
  rollback:
    name: Flip Nginx to previous color
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION:   ap-southeast-1
      SG_TAG:       bobross-gallery-sg
      INSTANCE_TAG: bobross-gallery-app

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region:     ${{ env.AWS_REGION }}

      - name: Look up EC2 IP and security group
        id: aws
        run: |
          IP=$(aws ec2 describe-instances \
                 --filters "Name=tag:Name,Values=$INSTANCE_TAG" \
                           "Name=instance-state-name,Values=running" \
                 --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          SG=$(aws ec2 describe-security-groups \
                 --filters "Name=tag:Name,Values=$SG_TAG" \
                 --query "SecurityGroups[0].GroupId" --output text)
          if [[ -z "$IP" || "$IP" == "None" ]]; then
            echo "::error::No running EC2 tagged Name=$INSTANCE_TAG"
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "sg=$SG" >> "$GITHUB_OUTPUT"

      - name: Discover this runner's public IP
        id: runner
        run: echo "ip=$(curl -fsS https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Temporarily allow SSH from this runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.aws.outputs.sg }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner.outputs.ip }}/32 || true

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Rollback on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i ~/.ssh/deploy_key \
              ubuntu@${{ steps.aws.outputs.ip }} \
              bash < deploy/rollback.sh

      - name: Revoke temporary SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.aws.outputs.sg }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner.outputs.ip }}/32 || true
