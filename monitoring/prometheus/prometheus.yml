# prometheus.yml — scrape config for the Blue-Green-Deployment project.
#
# Scrapes:
#   bobross-gallery  — both app containers (blue on 3001, green on 3002)
#   node             — EC2 host CPU/mem/disk via node_exporter
#   prometheus       — Prometheus's own metrics
#
# All targets are "localhost" because Prometheus runs with network_mode: host —
# it shares the host's network namespace, so 127.0.0.1 means the EC2's own
# loopback (where the app containers and node_exporter are bound).

global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: bobross-gallery
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:3001
          - localhost:3002
    relabel_configs:
      - source_labels: [__address__]
        regex: 'localhost:3001'
        target_label: instance
        replacement: blue
      - source_labels: [__address__]
        regex: 'localhost:3002'
        target_label: instance
        replacement: green

  - job_name: node
    static_configs:
      - targets: [localhost:9100]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
