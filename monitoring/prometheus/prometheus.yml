# prometheus.yml — scrape config for the Blue-Green-Deployment project.
#
# Scrapes:
#   bobross-gallery  — both app containers (blue on 3001, green on 3002)
#   node             — EC2 host CPU/mem/disk via node_exporter
#   prometheus       — Prometheus's own metrics (useful for debugging)
#
# host.docker.internal resolves to the EC2's host networking (configured via
# extra_hosts in docker-compose), so we can reach ports bound to 127.0.0.1
# on the host (the app containers' published ports).

global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: bobross-gallery
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3001
          - host.docker.internal:3002
    relabel_configs:
      # Prettier instance label in Grafana: "blue" and "green" instead of
      # "host.docker.internal:3001". The app also tags each metric with
      # its own color label, so this is just a nicety.
      - source_labels: [__address__]
        regex: 'host\.docker\.internal:3001'
        target_label: instance
        replacement: blue
      - source_labels: [__address__]
        regex: 'host\.docker\.internal:3002'
        target_label: instance
        replacement: green

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
